name: Build Forge Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'zulu'
    - name: Install Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
        unzip gradle-4.10.3-bin.zip
        echo "$GITHUB_WORKSPACE/gradle-4.10.3/bin" >> $GITHUB_PATH
    - name: Setup Forge
      run: gradle setupDecompWorkspace --no-daemon
    - name: Build Mod
      run: gradle build --no-daemon
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CustomPaintings-Jar
        path: build/libs/*.jar
